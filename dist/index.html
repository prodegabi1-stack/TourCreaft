          from { width: 0%; }
          to { width: 100%; }
        }
        @keyframes shareModalIn {

            opacity: 0;

          }
          to {
            opacity: 1;
            transform: scale(1) translateY(0);
          }

        #pano { cursor: grab; }

        option {
          background-color: #151817;

        .hs-glow {
          width: 40px; height: 40px;

          transform-origin: 50% 50% !important;
        }
